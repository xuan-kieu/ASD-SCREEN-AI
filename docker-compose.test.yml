version: '3.8'

services:
  db:
    image: postgres:15
    container_name: asd_pg_test
    environment:
      POSTGRES_USER: asd_user
      POSTGRES_PASSWORD: asd_pass
      POSTGRES_DB: asd_screening
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asd_user -d asd_screening"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: asd_redis_test
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asd_backend_test
    environment:
      DATABASE_URL: postgresql://asd_user:asd_pass@db:5432/asd_screening
      REDIS_URL: redis://redis:6379
      SECRET_KEY: asd-screen-ai-secret-key-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      TELEGRAM_BOT_TOKEN: ""
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:20-alpine
    container_name: asd_frontend_test
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
