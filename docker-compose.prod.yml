services:

  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: asd_sqlserver
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - asd_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: asd_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - asd_network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asd_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ENVIRONMENT: "production"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - asd_network
    restart: always
    # Production: không dùng --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: asd_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - asd_network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: asd_nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - asd_network
    restart: always

  chatbot:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: asd_chatbot
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      API_URL: "http://backend:8000"
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      - backend
    networks:
      - asd_network
    restart: unless-stopped

volumes:
  sqlserver_data:
  redis_data:
  media_files:

networks:
  asd_network:
    driver: bridge