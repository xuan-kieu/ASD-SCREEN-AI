services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: asd-screen-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asd-screen-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: asd-screen-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production

  # ── Frontend Static ──────────────────────────────────────────
  - type: web
    name: asd-screen-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://asd-screen-backend.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: asd-screen-db
    plan: free

  - name: asd-screen-redis
    type: redis
    plan: free